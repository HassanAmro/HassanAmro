<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Berthwise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Berthwise: a live 3D container terminal dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D port with frosted glass instruments floating at the edges (top bar, KPI row, right detail, bottom tracker + table). */
:root{
  --sand:#F2ECE1;          /* ground / page */
  --ink:#1D2A2D;           /* primary text */
  --muted:#617072;         /* secondary text */
  --teal:#0FA3A3;          /* the one accent */
  --teal-ink:#0B7F80;
  --teal-soft:rgba(15,163,163,.14);
  --glass:rgba(250,247,240,.68);
  --glass-strong:rgba(250,247,240,.92);
  --edge:rgba(255,255,255,.75);
  --line:rgba(29,42,45,.10);
  --chip:rgba(29,42,45,.06);
  --ok:#3F9A62; --warn:#D3922A; --crit:#C64B3C; --info:#4F7FAE;
  --shadow:0 18px 40px -22px rgba(48,58,54,.45), 0 2px 6px -2px rgba(48,58,54,.12);
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
  --bottom-h:248px;
  color-scheme: light;
}
/* Night is driven by the port clock, not the OS: the whole world goes dark together. */
body.night{
  --ink:#E7EEEC; --muted:#93A6A6; --teal:#2CC4C1; --teal-ink:#5ED8D5; --teal-soft:rgba(44,196,193,.16);
  --glass:rgba(17,27,34,.62); --glass-strong:rgba(19,29,37,.94); --edge:rgba(255,255,255,.09);
  --line:rgba(231,238,236,.10); --chip:rgba(231,238,236,.07);
  --shadow:0 18px 40px -20px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sand);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased;}
body{transition:color .6s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ui{position:absolute;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));}
.ui > *{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:var(--r);transition:background .6s, border-color .6s}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- top bar ---------- */
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));
  height:58px;display:flex;align-items:center;gap:14px;padding:0 10px 0 14px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-top:-2px}
.search{position:relative;flex:1 1 220px;max-width:340px;min-width:0}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--chip);padding:0 12px 0 34px;outline:none;transition:border-color .2s, background .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--teal);background:var(--glass-strong)}
.search > svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.dropdown{position:absolute;top:calc(100% + 8px);background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);
  box-shadow:var(--shadow);border-radius:14px;padding:6px;z-index:30;min-width:240px}
.search .dropdown{left:0;right:0}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.dd-item:hover,.dd-item.active{background:var(--teal-soft)}
.dd-item .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:66px;flex:none;font-weight:600}
.dd-item .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-empty{padding:10px;color:var(--muted)}
.areas{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px;flex:none}
.areas button{height:32px;padding:0 13px;border-radius:9px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.areas button:hover{color:var(--ink)}
.areas button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.areas button.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:7px;vertical-align:1px}
.tb-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.menu-wrap{position:relative}
.menu-wrap .dropdown{right:0}
.chip-btn{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:11px;background:var(--chip);font-weight:600}
.chip-btn svg{width:18px;height:18px}
.chip-btn small{color:var(--muted);font-weight:500}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--chip);transition:background .2s}
.icon-btn:hover,.chip-btn:hover{background:var(--teal-soft)}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--glass-strong)}
.clock{display:flex;flex-direction:column;align-items:flex-end;padding:0 8px;line-height:1.1}
.clock b{font-family:var(--f-mono);font-weight:600;font-size:16px;display:flex;align-items:center;gap:7px}
.clock small{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 var(--teal);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(15,163,163,.6)}70%{box-shadow:0 0 0 7px rgba(15,163,163,0)}100%{box-shadow:0 0 0 0 rgba(15,163,163,0)}}
.user{display:flex;align-items:center;gap:9px;padding-left:8px;margin-left:4px;border-left:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.user b{display:block;font-size:13px}
.user small{display:block;font-size:11px;color:var(--muted)}
.wx-item{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.wx-item svg{width:20px;height:20px;grid-row:span 2}
.wx-item b{font-weight:600}
.wx-item small{color:var(--muted);font-size:12px}
.wx-item:hover{background:var(--chip)}
.wx-item.on{background:var(--teal-soft)}
.wx-item.on svg{color:var(--teal-ink)}
.alert-list{width:340px;max-height:380px;overflow:auto}
.alert-row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:9px 10px;border-radius:10px;align-items:start}
.alert-row:hover{background:var(--chip)}
.alert-row i{width:8px;height:8px;border-radius:50%;margin-top:5px}
.alert-row b{font-weight:600;font-size:13px}
.alert-row p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.alert-row time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dd-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 8px}
.dd-head button{font-size:12px;color:var(--teal-ink);font-weight:600}

/* ---------- KPI cards ---------- */
.kpis{position:absolute;top:calc(env(safe-area-inset-top,0px) + 82px);left:max(12px, env(safe-area-inset-left,0px));display:flex;gap:10px}
.kpi{width:232px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:4px}
.kpi-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-h .eyebrow,.trend{white-space:nowrap}
.kpi-v{display:flex;align-items:baseline;gap:8px}
.kpi-v b{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi-v small{color:var(--muted);font-size:12px}
.trend{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--chip)}
.trend.up{color:var(--ok)} .trend.down{color:var(--crit)}
.spark{width:100%;height:34px;display:block}
.ubar{display:flex;gap:3px;height:8px;margin-top:6px}
.ubar span{flex:1;border-radius:4px;background:var(--chip);overflow:hidden;position:relative}
.ubar span i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:4px;transition:width .6s}
.ubar-l{display:flex;gap:3px;font-size:10.5px;color:var(--muted);margin-top:3px}
.ubar-l span{flex:1}
.berth-dots{display:flex;gap:6px;margin-top:6px}
.berth-dots span{flex:1;height:8px;border-radius:4px;background:var(--chip)}
.berth-dots span.on{background:var(--teal)}
.berth-dots span.mv{background:repeating-linear-gradient(90deg,var(--teal) 0 6px,transparent 6px 10px);opacity:.7}
.kpi .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}

/* ---------- detail panel ---------- */
#detail{position:absolute;top:calc(env(safe-area-inset-top,0px) + 82px);right:max(12px, env(safe-area-inset-right,0px));width:348px;
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--bottom-h) + 24px);display:flex;flex-direction:column;overflow:hidden;transition:bottom .35s ease}
.d-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.d-head .ttl{flex:1;min-width:0}
.d-kind{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--teal-ink)}
.d-kind::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--teal)}
.d-head h2{margin:4px 0 2px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.d-head p{margin:0;color:var(--muted);font-size:12.5px}
.d-actions{display:flex;gap:6px}
.d-actions .icon-btn{width:32px;height:32px;border-radius:9px}
.d-actions .icon-btn.on{background:var(--teal);color:#fff}
.d-body{flex:1;overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.d-body > *{flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--chip)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)} .tone-crit{color:var(--crit)} .tone-info{color:var(--info)} .tone-teal{color:var(--teal-ink)} .tone-idle{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stats div{background:var(--glass-strong);padding:9px 11px;min-width:0}
.stats dt{font-size:11px;color:var(--muted);margin-bottom:2px}
.stats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prog{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .4s}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--chip)}
.steps span.done{background:var(--teal);opacity:.45}
.steps span.cur{background:var(--teal)}
.bayplan{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.bayplan i{aspect-ratio:1/1.1;border-radius:2px;background:var(--teal);max-width:100%}
.bayplan-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.tiers{display:flex;flex-direction:column;gap:4px}
.tier{display:grid;grid-template-columns:30px 12px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:var(--chip);font-size:12.5px}
.tier .sw{width:12px;height:12px;border-radius:3px}
.tier small{color:var(--muted)}
.tier.empty{opacity:.45}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.ev{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ev time{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.hint{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--teal-soft);color:var(--ink);font-size:12.5px}
.hint svg{width:20px;height:20px;flex:none;color:var(--teal-ink)}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov{padding:10px;border-radius:12px;background:var(--chip)}
.ov b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ov span{font-size:11.5px;color:var(--muted)}

/* ---------- bottom row ---------- */
.bottom{position:absolute;left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);height:var(--bottom-h);
  display:grid;grid-template-columns:430px minmax(0,1fr);gap:12px;transition:height .35s ease;pointer-events:none}
.bottom > *{pointer-events:auto}
body.collapsed{--bottom-h:46px}
.panel{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 16px;flex:none;min-height:46px}
.p-head h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.p-head .count{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--chip);padding:2px 8px;border-radius:20px}
.p-head .sp{flex:1}
.collapse-btn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip)}
.collapse-btn svg{width:16px;height:16px;transition:transform .3s}
body.collapsed .collapse-btn svg{transform:rotate(180deg)}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 12px 8px 16px}
.pipeline div{padding:6px 7px 6px;border-radius:10px;background:var(--chip);position:relative}
.pipeline div b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pipeline div span{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.pipeline div.hot{background:var(--teal-soft)}
.pipeline div.hot b{color:var(--teal-ink)}
.vlist{flex:1;overflow:auto;padding:0 8px 8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 68px;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;width:100%;text-align:left}
.vrow:hover{background:var(--chip)}
.vrow.sel{background:var(--teal-soft)}
.vrow .nm{min-width:0}
.vrow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.vrow .nm small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .st{font-size:11.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.vrow .st b{display:block;color:var(--ink);font-weight:600;font-size:12px}
.tabs{display:flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{height:28px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tablewrap{flex:1;overflow:auto;padding:0 8px 8px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{position:sticky;top:0;background:var(--glass-strong);text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 8px;z-index:1;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--teal-soft)}
tbody tr.sel td{background:var(--teal-soft)}
td.r,th.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sw-inline{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.mini-prog{display:inline-block;width:60px;height:5px;border-radius:3px;background:var(--chip);vertical-align:2px;margin-right:6px;overflow:hidden}
.mini-prog i{display:block;height:100%;background:var(--teal)}

/* ---------- 3D overlays ---------- */
#selLabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;padding:5px 10px 5px 8px;border-radius:9px;
  background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-top:-10px}
#selLabel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
#selLabel::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--glass-strong);transform:translateX(-50%) rotate(45deg);border-right:1px solid var(--edge);border-bottom:1px solid var(--edge)}
#selLabel small{color:var(--muted);font-weight:500}
#toasts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 82px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:20}
.toast{pointer-events:auto;padding:9px 14px 9px 12px;border-radius:12px;font-size:13px;display:flex;gap:9px;align-items:center;animation:tin .35s ease;max-width:min(420px, calc(100vw - 32px))}
.toast i{width:8px;height:8px;border-radius:50%;flex:none}
.toast b{font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--sand);z-index:50;transition:opacity .6s}
.loader div{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.loader small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-top:8px}
.loader.err small{color:var(--crit);text-transform:none;letter-spacing:0;max-width:320px}
.mdock{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .user div{display:none}
  .kpi{width:192px}
  .kpi-v b{font-size:28px}
  .bottom{grid-template-columns:370px minmax(0,1fr)}
  #detail{width:310px}
}
@media (max-width:900px){
  .brand small{display:none}
}

  arc(x0 + r, z1 - r, Math.PI / 2, Math.PI);
  arc(x0 + r, z0 + r, Math.PI, Math.PI * 1.5);

}

const mphHist = [];

function renderKPIs() {
  const mph = mphNow();
  $('#kMph').textContent = mph;
  const prev = mphHist.length > 20 ? mphHist[mphHist.length - 20] : mph;
  const ch = prev ? Math.round((mph - prev) / prev * 100) : 0;
  const tr = $('#kMphTrend'); tr.textContent = `${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch)}%`; tr.className = 'trend ' + (ch >= 0 ? 'up' : 'down');

  const h = mphHist.slice(-48); if (h.length > 1) {
    const max = Math.max(...h, 10) * 1.12, min = 0, W = 200, H = 34;
    const pts = h.map((v, i) => [i / (h.length - 1) * W, H - 2 - (v - min) / (max - min) * (H - 6)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];

      <line x1="0" x2="200" y1="${H - 2}" y2="${H - 2}" stroke="var(--line)"/><path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="var(--teal)" stroke-width="1.8" vector-effect="non-scaling-stroke"/><circle cx="${last[0] - 2}" cy="${last[1]}" r="2.6" fill="var(--teal)"/>`;

    $('#tCount').textContent = `${berths.filter(b => b.ship).length} vessels in port`;
  } else if (tab === 'equipment') {
    head = '<tr><th>ID</th><th>Type</th><th>Status</th><th>Location</th><th class="r">Moves</th><th class="r">Load</th></tr>';

      const ld = e.box ? `${e.box.weight.toFixed(1)} t` : e.kind === 'train' ? `${train.wagons.filter(w => w.box).length} boxes` : '—';

  } else {

      tableRows.push(m.box);

  wrap.scrollTop = st; wrap.scrollLeft = sl;
}
$('#tablewrap').addEventListener('click', e => {
  const tr = e.target.closest('tbody tr'); if (!tr) return;

  if (x.id && x.owner) { const h = holderEntity(x); if (h) select(h); else pushAlert('info', `${isoFmt(x.id)} has left the terminal`, 'Moved out via gate or vessel', true); }
  else select(x);
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); $('#tablewrap').scrollTop = 0; renderTable(true); });

/* ---------- search ---------- */
let sIdx = 0, sRes = [];
function searchAll(q) {
  q = q.trim().toUpperCase().replace(/\s+/g, ''); if (q.length < 2) return [];
  const out = [];
  for (const s of ships) if (s.vessel.name.toUpperCase().replace(/\s+/g, '').includes(q) || s.vessel.imo.includes(q)) out.push({ k: 'Vessel', t: s.vessel.name, e: s });
  for (const e of eqList()) if (entName(e).toUpperCase().replace(/\s+/g, '').includes(q)) out.push({ k: 'Equipment', t: entName(e), e });
  for (const t of gate.trucks) if (t.plate.toUpperCase().includes(q)) out.push({ k: 'Gate truck', t: `${t.plate} · ${t.haulier}`, e: t });
  if (/^[A-F]-?\d/.test(q)) for (const bl of blocks) if (q[0] === bl.id) for (let b = 0; b < 8; b++) for (let r = 0; r < 6; r++) { const se = stackEntity(bl, { b, r }); if (se.id.replace(/-/g, '').startsWith(q.replace(/-/g, ''))) out.push({ k: 'Stack', t: se.id, e: se }); }
  for (const box of allBoxes) { if (out.length > 30) break; if (box.id.includes(q) && box.holder) out.push({ k: 'Container', t: `${isoFmt(box.id)} · ${box.type.label} · ${box.weight.toFixed(1)} t`, e: null, box }); }
  return out.slice(0, 8);
}
function renderSearch() {
  const el = $('#searchResults'), q = $('#search').value;
  sRes = searchAll(q);

  el.hidden = false;
  el.innerHTML = sRes.length ? sRes.map((r, i) => `<button class="dd-item ${i === sIdx ? 'active' : ''}" data-i="${i}"><span class="k">${r.k}</span><span class="t ${r.k === 'Container' ? 'mono' : ''}">${r.t}</span></button>`).join('') : `<div class="dd-empty">No match for “${q.replace(/</g, '&lt;')}”. Try a container number like ${isoFmt([...allBoxes][0].id).slice(0, 4)}…</div>`;
}
function chooseSearch(i) {
  const r = sRes[i]; if (!r) return;
  const e = r.e || holderEntity(r.box); if (e) select(e);
  $('#search').value = ''; $('#searchResults').hidden = true; $('#search').blur();
}
$('#search').addEventListener('input', () => { sIdx = 0; renderSearch(); });
$('#search').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sIdx = Math.min(sRes.length - 1, sIdx + 1); renderSearch(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sIdx = Math.max(0, sIdx - 1); renderSearch(); e.preventDefault(); }
  else if (e.key === 'Enter') chooseSearch(sIdx);
  else if (e.key === 'Escape') { $('#searchResults').hidden = true; $('#search').blur(); }
});
$('#searchResults').addEventListener('pointerdown', e => { const b = e.target.closest('.dd-item'); if (b) { e.preventDefault(); chooseSearch(+b.dataset.i); } });
$('#search').addEventListener('blur', () => setTimeout(() => { $('#searchResults').hidden = true; }, 150));

/* ---------- menus & controls ---------- */
function closeMenus(except) { for (const id of ['#weatherMenu', '#alertMenu']) if (id !== except) $(id).hidden = true; }
$('#weatherBtn').onclick = e => { e.stopPropagation(); const m = $('#weatherMenu'); closeMenus('#weatherMenu'); m.hidden = !m.hidden; };

document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenus(); });
$('#dayNight').onclick = () => { const night = env.nightF > .55; env.warpTo = night ? 9 * 60 + 30 : 21 * 60 + 40; };

$('#collapseBtn').onclick = () => document.body.classList.toggle('collapsed');

}
$('#mdock').onclick = e => { const b = e.target.closest('button'); if (!b) return; const on = document.body.classList.contains('m-' + b.dataset.m); setDock(on ? null : b.dataset.m); };
addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement.tagName !== 'INPUT') { if (selected) clearSelection(); closeMenus(); } });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =====================================================================
   Boot
   ===================================================================== */
buildGround(); buildYard(); buildScenery(); buildGate(); buildRail();
{
  const defs = [['QC-01', -70, 0, [0, 1, 2, 3, 4]], ['QC-02', -28, 0, [5, 6, 7, 8, 9]], ['QC-03', 20, 1, [0, 1, 2, 3, 4]], ['QC-04', 62, 1, [5, 6, 7, 8, 9]]];
  for (const [id, x, bi, bays] of defs) { const c = makeSTS(id, x, berths[bi]); c.bays = bays; berths[bi].cranes.push(c); cranes.push(c); }
  for (const b of berths) { b.cranes[0].partner = b.cranes[1]; b.cranes[1].partner = b.cranes[0]; }
  for (const bl of blocks) rtgs.push(makeRTG(`RTG-${10 + blocks.indexOf(bl) + 1}`, bl));
  berths.forEach((b, i) => { const t = makeTug(`Tug ${['Kittiwake', 'Puffin'][i]}`, 118, -6 - i * 9); t.berthId = b.id; b.tug = t; tugs.push(t); });
  for (let i = 0; i < 9; i++) {
    const t = makeTruck(`TT-${21 + i}`, i); const slot = parkSlots[i];
    if (slot) { t.s = slot.s; t.slot = slot; slot.taken = t; t.lat = 1; t.onLane = false; t.target = slot.s; }
    else { t.s = LOOP.project(-60 + (i - 6) * 40, ZY) ; t.lat = 0; t.onLane = true; t.target = null; }
    trucks.push(t); applyTruck(t, true); spawn(truckLife(t));
  }
  for (let i = 0; i < 2; i++) { const v = newVessel(); v.stage = 5; v.atd = env.minute - 140 - i * 210; v.berth = null; v.status = 'At sea'; sailed.push(v); }
  for (let i = 0; i < 3; i++) upcoming.push(newVessel());
  // first vessel at B1 is already alongside; B2's vessel arrives with its tug
  for (const c of cranes) { c.mt = [...Array(5)].map(() => -rand(0, 300)); spawn(stsLife(c)); }
  spawn(berthLife(berths[0], { alongside: true }));
  spawn(berthLife(berths[1]));
  for (const r of rtgs) spawn(rtgLife(r));
  for (let i = 0; i < 4; i++) spawnGateTruck(Math.max(0, G_IN - i * 16.5));
  train.x = 27; spawn(trainLife());
  // history: synthetic earlier moves so KPIs open on a warmed-up shift
  for (let i = 0; i < 22; i++) moveTimes.push(-rand(0, 150));
  for (let i = 0; i < 48; i++) mphHist.push(Math.round(100 + Math.sin(i * .4) * 9 + rand(-6, 6)));
  const yb = []; for (const bl of blocks) for (let b = 0; b < 8; b++) for (let r = 0; r < 6; r++) { const h = bl.stacks.height(b, r); if (h) yb.push([bl.stacks.slots[b][r][h - 1], bl, b, r, h - 1]); }
  for (let i = 0; i < 10; i++) {
    const [box, bl, b, r, t] = pick(yb);
    moves.push({ time: clockStr(env.minute - 2 - i * 3), box, from: `${sailed[0].name.replace('MV ', '')} ${shipLoc(randi(0, 9), randi(0, 5), randi(0, 3))}`, to: yardLoc(bl, b, r, t), eq: pick(['QC-01', 'QC-02', 'RTG-11', 'RTG-12', 'RTG-13']) });
  }
  pushAlert('info', 'Shift B handover complete', '4 STS · 3 RTG · 9 tractors on shift', false);
  pushAlert('warn', 'Berth 2 vessel inbound', 'Pilot boarding at outer anchorage', false);
  alertUnread = 2; renderAlerts();
}
renderWeather(); renderDayNightBtn(); refreshEtas();
$('#dateStr').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
renderDetailHead(); renderDetailBody(); renderTracker(); renderTable(true); renderKPIs();
if (IS_MOBILE) setDock(null);

/* =====================================================================
   Main loop
   ===================================================================== */
let last = performance.now(), uiT = 0, slowT = 1, histT = 0, booted = false;
function frame(now) {
  requestAnimationFrame(frame);
// debug handle: advance the simulation without rendering (used for soak tests)
window.__berthwise = { step(n = 600, dt = 1 / 30) { for (let i = 0; i < n; i++) { DT = dt; T += dt; simStep(); } }, state: () => ({ T, berths: berths.map(b => [b.id, b.phase, b.ship && b.ship.vessel.name, b.cranes.map(c => c.status + '/' + c.phaseMoves)]), trucks: trucks.map(t => [t.id, t.status, +t.s.toFixed(1), t.lat]), gate: gate.trucks.length, moves: moves.length, tasks: tasks.length, lock: seaLock && seaLock.id, rtgs: rtgs.map(r => r.id + ':' + r.status + ' q' + r.queue.length), yard: blocks.map(b => b.stacks.count()) }) };
  DT = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; T += DT;
  simStep();
  renderStep();
}
function simStep() {
  updateEnv();
  dispatch();
  for (let i = tasks.length - 1; i >= 0; i--) {
    try { if (tasks[i].next().done) tasks.splice(i, 1); }
    catch (err) { console.error(err); tasks.splice(i, 1); }
  }
  for (const t of trucks) { moveTruck(t); applyTruck(t); }
  gate.spawnT -= DT;
  if (gate.spawnT <= 0 && gate.trucks.length < 9 && gate.trucks.every(o => o.s > 17)) { spawnGateTruck(0); gate.spawnT = rand(5, 11); }
  for (const t of gate.trucks) { moveGateTruck(t); applyGateTruck(t); }
  for (const k of ['in', 'out']) { const b = gate.barriers[k]; b.a = lerp(b.a, b.target, Math.min(1, DT * 4)); b.pv.rotation.z = b.dir * b.a * 1.4; }
  for (const c of cranes) applySTS(c);
  for (const r of rtgs) applyRTG(r);
  for (const s of ships) {
    const along = s.z > -12;
    s.group.position.set(s.x, Math.sin(T * .7 + s.phase) * .14 * (.3 + env.wave) * (along ? .4 : 1), s.z);
    s.group.rotation.x = Math.sin(T * .55 + s.phase) * .007 * env.wave * (along ? .3 : 1.6);
    for (const l of s.lines) if (l.m.visible) setBeam(l.m, _v2.set(l.lx, SHIP_DECK + .4, 8.6), _v1.set(l.lx * 1.22, Q + 1 - s.group.position.y, 1.3 - s.z), .18);
  }
  for (const t of tugs) {
    if (t.attach) { const a = t.attach, k = Math.min(1, DT * 3.5); t.x = lerp(t.x, a.ship.x + a.dx, k); t.z = lerp(t.z, a.ship.z + a.dz, k); t.yaw += angDiff(t.yaw, a.yaw) * k; }
    t.group.position.set(t.x, Math.sin(T * 1.3 + t.base.z) * .2 * (.3 + env.wave), t.z);
    t.group.rotation.set(Math.sin(T * 1.1 + t.base.z) * .02 * env.wave, t.yaw, 0);
  }
  train.group.position.set(train.x - 6, Q, RAIL_Z);
  randomEvents();
}
function renderStep() {
  updateCamera();
  // selection ring & label
  if (selected) {
    const [x, y, z, R] = entRing(selected);
    ring.position.set(x, y, z);
    const p = (T % 1.6) / 1.6;
    ringA.scale.setScalar(R * (1 + .03 * Math.sin(T * 5))); ringD.scale.setScalar(R);
    ringB.scale.setScalar(R * (1 + p * .45)); pulseMat.opacity = (1 - p) * .8;
    entPos(selected, _p); _p.y = selected.kind === 'stack' ? Q + 2.6 * selected.block.stacks.height(selected.b, selected.r) + 2 : selected.kind === 'ship' ? LABEL_H.ship : (selected.kind === 'tug' ? 0 : Q) + LABEL_H[selected.kind];
    _p.project(camera);
    const lab = $('#selLabel');
    if (_p.z < 1 && Math.abs(_p.x) < 1.2 && Math.abs(_p.y) < 1.2) { lab.style.display = ''; lab.style.transform = `translate(${(_p.x * .5 + .5) * innerWidth}px, ${(-_p.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`; }
    else lab.style.display = 'none';
  }
  renderer.render(scene, camera);
  // UI cadence
  uiT += DT; slowT += DT; histT += DT; areaLock -= DT;
  if (uiT > .25) { uiT = 0; renderDetailBody(); renderKPIs(); $('#clock').textContent = clockStr(); $('#wxWind').textContent = `${Math.round(env.wind)} km/h`; }
  if (slowT > 1) {
    slowT = 0; refreshEtas(); renderTracker();
    if (!(tab === 'containers' && $('#tablewrap').matches(':hover'))) renderTable();
    if (areaLock <= 0 && !fly.on) { let best = null, bd = 1e9; for (const [k, a] of Object.entries(AREAS)) { const d = a.t.distanceTo(controls.target); if (d < bd) { bd = d; best = k; } } setArea(best); }
  }
  if (histT > 3) { histT = 0; mphHist.push(mphNow()); if (mphHist.length > 80) mphHist.shift(); }
  if (!booted) { booted = true; const l = $('#loader'); l.style.opacity = '0'; setTimeout(() => l.remove(), 700); }
}
requestAnimationFrame(frame);
// debug handle: advance the simulation without rendering (used for soak tests)
window.__berthwise = { step(n = 600, dt = 1 / 30) { for (let i = 0; i < n; i++) { DT = dt; T += dt; simStep(); } }, state: () => ({ T, berths: berths.map(b => [b.id, b.phase, b.ship && b.ship.vessel.name, b.cranes.map(c => c.status + '/' + c.phaseMoves)]), trucks: trucks.map(t => [t.id, t.status, +t.s.toFixed(1), t.lat]), gate: gate.trucks.length, moves: moves.length, tasks: tasks.length, lock: seaLock && seaLock.id, rtgs: rtgs.map(r => r.id + ':' + r.status + ' q' + r.queue.length), yard: blocks.map(b => b.stacks.count()) }) };
